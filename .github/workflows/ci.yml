name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # ROS integration runs in a Humble container; pure manager tests need no ROS.
      - name: Ruff lint
        run: uvx ruff@0.12.0 check .

      - name: Ruff format check
        run: uvx ruff@0.12.0 format --check .

      - name: Navigation manager tests
        run: uv run --no-project --with pyyaml python3 -m unittest discover -s tests -v

  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check commit messages
        run: >
          uvx --from commitizen@4.16.3 cz check
          --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
